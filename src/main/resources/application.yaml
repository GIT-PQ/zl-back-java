server:
  port: 8081
  servlet:
    context-path: /

spring:
  application:
    name: zl-back-java
  # 数据库配置（根据实际情况修改）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/zl?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 123456

# MyBatis 配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.pq.zlbackjava.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# Python服务配置
python:
  service:
    url: http://localhost:5000

# 日志配置
logging:
  level:
    root: INFO
    com.pq.zlbackjava: DEBUG

